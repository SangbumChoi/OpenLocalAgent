# Scheduled closed-loop self-improvement: run the dispatch loop, open a PR only if it beats the
# deployed baseline (the human-approval hand-off). The model is a 28M byte model, so the loop is
# CPU-cheap and costs ZERO LLM tokens.
name: dispatch-auto-improve
on:
  schedule:
    - cron: '17 6 * * *'        # daily 06:17 UTC
  workflow_dispatch:
    inputs:
      margin:
        description: 'min %-point gain over baseline to open a PR'
        default: '2'
permissions:
  contents: write
  pull-requests: write
jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . huggingface_hub
      - id: loop
        run: python scripts/auto_improve.py --run --margin ${{ github.event.inputs.margin || '2' }}
      - name: Open PR if the loop beat the baseline
        if: steps.loop.outputs.improved == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/dispatch-improve
          title: "auto: dispatch loop free-form top-1 ${{ steps.loop.outputs.baseline }}% -> ${{ steps.loop.outputs.best }}%"
          commit-message: "auto: dispatch self-improvement loop result"
          body: |
            The scheduled dispatch self-improvement loop **beat the deployed baseline**.

            - baseline (round 0): **${{ steps.loop.outputs.baseline }}%** free-form top-1
            - best: **${{ steps.loop.outputs.best }}%**

            See `docs/DISPATCH_LOOP_LOG.md` and `docs/dispatch_improvement.json`.
            Merging accepts the result; regenerate `runs/tiny-30m-dispatch-loop.pt` via
            `python scripts/dispatch_loop.py` (or push it to the Hub with an `HF_TOKEN`).
          add-paths: |
            docs/DISPATCH_LOOP_LOG.md
            docs/dispatch_improvement.json
      - name: No improvement -> no PR (cost discipline)
        if: steps.loop.outputs.improved != 'true'
        run: echo "Loop halted with no gain over baseline by the margin; no PR opened."

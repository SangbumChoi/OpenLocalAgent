# Teacher-forced retention sweep for every immutable mixed-replay pilot archive.
#
# This is intentionally strict: a format-recovery candidate is not eligible for greedy action
# evaluation unless it preserves the exact held-out token/sequence accuracies and changes mean
# loss by no more than a small numerical tolerance. The sweep independently reconstructs the
# verified train/eval overlap audit and re-hashes every checkpoint before and after evaluation.

# Curated, source-linked inventory for realistic mobile, browser, computer-use, and tool agents.
# This is a catalog, not a downloader.  Payloads stay outside Git and every acquired snapshot
# must record revision, bytes, and SHA-256 in a separate provenance manifest.
kind: localagent_realistic_agent_catalog
schema_version: 1
purpose: realistic_agent_training_and_webgpu_evaluation
entries:
  - id: androidcontrol
    family: mobile
    name: AndroidControl
    source_url: https://github.com/google-research/google-research/tree/master/android_control
    paper_url: https://arxiv.org/abs/2406.03679
    code_url: https://github.com/google-research/google-research/tree/master/android_control
    data_access_url: https://console.cloud.google.com/storage/browser/gresearch/android_control
    data_access_mirror_url: https://huggingface.co/datasets/OfficerChul/Android-Control-84k
    access_status: public_download
    license:
      name: Apache-2.0
      url: https://www.apache.org/licenses/LICENSE-2.0
      evidence: https://github.com/google-research/google-research/tree/master/android_control
    scale:
      kind: dataset
      demonstrations: 15283
      unique_tasks: 14548
      apps: 833
      app_categories: 40
    observation:
      modalities: [text, accessibility_tree, screenshot]
      formats: [TFRecord-GZIP, PNG, AndroidAccessibilityForest-proto]
    action:
      modalities: [structured_action]
      formats: [JSON]
    domains: [mobile_ui, messaging, productivity, settings, search]
    train_policy: train
    integration:
      status: supported_text_first_pilot
      target_adapter: openlocalagent.data.androidcontrol_via_localagent_v1
      source_split_policy: official_split_file_required
    webgpu_projection:
      status: feasible_text_first
      recommended_observation: accessibility_tree_plus_goal
      screenshot_policy: optional_native_only
    contamination:
      split: official_generalization_splits
      rule: train only on the official training partition; keep app/task holdouts hash-bound
    notes: Public human demonstrations with high- and low-level instructions; raw TFRecords require an audited converter. The Apache-2.0 JSON mirror is an alternate action-format export and is accepted only with an explicit screenshot-omitted provenance manifest.


# Immutable upstream plan for paper decontamination and external evaluation.
#
# This file contains no benchmark payload or gold label. The prompt-only suites generated before
# tokenizer fitting establish revision-bound local holdout, not chronological freshness. A later
# fresh-evaluation claim requires a different post-training source or procedural seed freeze.
kind: localagent_external_benchmark_plan
schema_version: 1
purpose: pretraining_prompt_only_decontamination
forbid_gold_in_prompt_exports: true

prompt_freeze:
  suite_contract_kind: localagent_evaluation_denylist_suite_contract
  suite_provenance_kind: localagent_evaluation_denylist_suite_provenance
  list_manifest_kind: localagent_evaluation_denylist_manifest
  schema_version: 1
  require_adapter_audit_binding: true
  require_license_evidence_binding: true
  require_prompt_only_isolation: true
  external_manifest_suites: [bfcl, browsergym, mind2web, weblinx]
  config_hash_pinned_direct_suites:
    - local-realtime-actions
    - local-browser-tasks
    - local-agent-eval


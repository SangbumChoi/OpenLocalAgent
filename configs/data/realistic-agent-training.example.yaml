normalization:
  interchange: openlocalagent.data.schema.Conversation
  text_first_observation: accessibility_tree_or_cleaned_dom_plus_goal
  action_encoding: canonical_sorted_json
  screenshot_policy: retain_in_provenance_do_not_feed_text_checkpoint
  require_official_split_manifest: true
  require_source_sha256: true
  fail_closed_on_unknown_license: true
evaluation_holdouts:

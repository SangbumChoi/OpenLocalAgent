# Training contract for realistic public demonstrations.
# This file is intentionally not executable acquisition metadata.  Replace each source snapshot
# with a locally verified artifact (bytes + SHA-256 + upstream revision) before ingestion.
kind: localagent_realistic_training_plan
schema_version: 1
catalog: realistic-agent-eval.catalog.yaml
allowed_train_ids:
  - androidcontrol
  - android_in_the_wild
  - xlam_function_calling
  - mind2web_train

    runtime: OSWorld-V2_real_desktop_environment
    webgpu_projection: text-only replay/protocol audit; native desktop VM required for score
    metric: execution_success_and_long_horizon_task_completion
    notes: The official release requires the v2026.06.24 code tag and the osworld-v2-2026.06.24 benchmark release. Public assets are incomplete; the gated asset snapshot must be downloaded locally and hashed before any run.


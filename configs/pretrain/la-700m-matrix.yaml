# la-700m on the five-source matrix, fifth rung: la-700m-matrix's spine with la-700m's budgets (32k/5k/3k steps).
# Stage 1 of the ladder for la-300m: language modelling on the extended open corpus.
#
# data/shards/pt-xl is FineWeb-Edu-dedup (ODC-BY-1.0) at roughly 7.5B tokens - sixteen times
# pt-big, which the three small tiers pretrained on and which cannot feed a model this size.
# Whole-file GETs from the Nexus HuggingFace mirror run at ~300 MB/s, so the corpus is a download
# and a packing job rather than a blocker; scripts/fetch_fineweb_xl.sh does both.
#
# Global batch is 64 rows x 2048 = 131,072 tokens per update, the same as every tier below, so the
# ladder varies capacity and step count and not the batch. 24,000 steps = 3.15B tokens.
#
# CORPUS: pt-big, not pt-xl. The extended corpus cannot currently be built - packing restarts from
# scratch whenever the box stops, which it does every three to four hours, and the job needs longer
# than that. The matrix holds 4.4B tokens, so 24,000 steps = 3.15B tokens is 0.7 of one pass at
# 10.5 tokens per parameter. Under-trained against Chinchilla, and stated rather than implied.
#
# What matters for the sparse arm is that la-150m, la-300m and la-300m-moe see the SAME corpus and
# the SAME budget; that comparison is internal, and pt-big serves it exactly as well.
stage: pretrain
model_config: configs/model/la-700m.yaml
data:
  weighting: sqrt_tokens
  sources:
    - {name: fineweb, path: data/shards/src/fineweb}
    - {name: c4, path: data/shards/src/c4}
    - {name: wikipedia, path: data/shards/src/wikipedia}
    - {name: cosmopedia, path: data/shards/src/cosmopedia}
    - {name: finemath, path: data/shards/src/finemath}
  tokenizer:
    kind: bpe
    path: data/tokenizer-h100-16k.json
optim:
  name: adamw
  lr: 2.0e-04
  weight_decay: 0.1
  grad_clip: 1.0
schedule:
  type: wsd
  warmup_steps: 640
  total_steps: 32000
  decay_frac: 0.2
batch:
  micro_batch_size: 4
  grad_accum_steps: 16
runtime:
  device: auto
  dtype: auto
  seed: 2026
  resume: true
log:
  out_dir: results/runs/pretrain-la-700m-matrix
  ckpt_every: 2000
  eval_every: 2000
  eval_batches: 32
  snapshot_every: 4000
  snapshot_keep: 2

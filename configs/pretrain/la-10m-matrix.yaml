# la-10m on the per-source matrix - the FIRST model of the current-tokenizer generation.
# Uses the three sources already packed (c4, cosmopedia, finemath); fineweb and wikipedia
# join the 93m arm once their packing finishes. Its purpose is a demo bundle the exporter
# will accept: every earlier checkpoint fails tokenizer provenance, correctly.
# Stage 1 of the ladder for la-10m: language modelling on open text.
#
# Corpus is data/shards/pt-big - FineWeb-Edu (260.1M tokens, ODC-BY-1.0), Cosmopedia v2 (69.9M,
# Apache-2.0) and permissive Python (135.5M, MIT/Apache/BSD/ISC): 460.7M train tokens, every
# source openly licensed. Bound to the 16K BPE tokenizer the shards were packed with.
#
# Global batch is held at 64 rows x 2048 = 131,072 tokens per update across every tier, so the
# ladder varies capacity and step count and not the batch. 3200 steps = 419.4M tokens
# = 39.9 tokens per parameter.
stage: pretrain
model_config: configs/model/la-10m.yaml
data:
  weighting: sqrt_tokens
  sources:
    - {name: c4, path: data/shards/src/c4}
    - {name: cosmopedia, path: data/shards/src/cosmopedia}
    - {name: finemath, path: data/shards/src/finemath}
  tokenizer:
    kind: bpe
    path: data/tokenizer-h100-16k.json
optim:
  name: adamw
  lr: 6.0e-4
  weight_decay: 0.1
  grad_clip: 1.0
schedule:
  type: wsd
  warmup_steps: 64
  total_steps: 3200
  decay_frac: 0.2
batch:
  micro_batch_size: 32
  grad_accum_steps: 2
runtime:
  device: auto
  dtype: auto
  seed: 2026
  resume: true
log:
  out_dir: results/runs/pretrain-la-10m-matrix
  ckpt_every: 400
  eval_every: 400
  eval_batches: 32
  snapshot_every: 1000
  snapshot_keep: 2

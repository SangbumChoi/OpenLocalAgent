# Ladder tier 3 — the best from-scratch arm the campaign produced, resized onto the ladder.
#
# Shape is the 95.3M arm (results/evalsuite-full/fcall-96m-s202.json, 23.07 mean step-success)
# with the FFN narrowed 1728 -> 1664. Twelve of eighteen mixers are short convolutions, which is
# what holds the 4K decode state down.
name: la-93m
vocab_size: 16384
d_model: 640
n_layers: 18
n_loops: 1
n_heads: 10
n_kv_heads: 1
ffn_hidden: 1664
max_seq_len: 4096
rope_theta: 10000.0
norm_eps: 1.0e-5
tie_embeddings: true
dropout: 0.0
qk_norm: true
conv_kernel: 3
layer_types:
  [conv, conv, attn, conv, conv, attn, conv, conv, attn, conv, conv, attn,
   conv, conv, attn, conv, conv, attn]
param_budget: 100000000

# Ladder tier 2 — the size Cactus Needle 2 ships at, so the comparison is like-for-like.
#
# Shape is the 42.8M arm (results/evalsuite-full/agentic-40m.json, 20.36 mean step-success) with
# the FFN widened 1280 -> 1408 to land on 45M. Everything else is held fixed so the ladder varies
# capacity and nothing else.
name: la-45m
vocab_size: 16384
d_model: 512
n_layers: 12
n_loops: 1
n_heads: 8
n_kv_heads: 1
ffn_hidden: 1408
max_seq_len: 4096
rope_theta: 10000.0
norm_eps: 1.0e-5
tie_embeddings: true
dropout: 0.0
qk_norm: true
conv_kernel: 3
layer_types:
  [conv, conv, attn, conv, conv, attn, conv, conv, attn, conv, conv, attn]
param_budget: 100000000

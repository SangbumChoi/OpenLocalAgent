# Parameter-matched all-attention control for webgpu-10m-hybrid.yaml.
#
# This is an untrained random-weight latency control, not a quality claim. Tokenizer, width, depth,
# 64-wide head geometry, context, and normalization match the hybrid arm. The 624-wide FFN is
# 16-aligned and compensates for replacing its two parameter-heavier gated-convolution mixers:
# 10.547M parameters versus 10.525M (+0.21%).
name: webgpu-10m-attn
vocab_size: 16384
d_model: 384
n_layers: 4
n_loops: 1
n_heads: 6
n_kv_heads: 1
ffn_hidden: 624
max_seq_len: 2048
rope_theta: 10000.0
norm_eps: 1.0e-5
tie_embeddings: true
dropout: 0.0
qk_norm: true
conv_kernel: 3
layer_types: [attn, attn, attn, attn]

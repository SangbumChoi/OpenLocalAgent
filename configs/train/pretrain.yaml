# Phase 2 — pretrain from scratch. Toy defaults; scale up per device.
stage: pretrain
model_config: configs/model/tiny-30m.yaml
data:
  shards_dir: data/shards
  seq_len: 2048
  tokenizer:
    kind: bpe
    path: data/tokenizer-32k.json
optim:
  name: adamw          # adamw | muon
  lr: 3.0e-4           # SmolLM2 reference
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
schedule:
  type: cosine
  warmup_steps: 200
  total_steps: 20000
  min_lr_ratio: 0.1    # cosine to 10% of peak
batch:
  micro_batch_size: 8
  grad_accum_steps: 4
runtime:
  device: auto         # auto | cuda | mps | cpu | xpu
  dtype: auto          # auto picks bf16/fp16/fp32 per device
  compile: false
log:
  out_dir: runs/pretrain
  ckpt_every: 1000
  eval_every: 1000

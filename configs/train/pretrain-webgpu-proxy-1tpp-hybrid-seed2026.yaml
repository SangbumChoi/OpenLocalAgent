# Bounded one-seed proxy for the matched 10.5M WebGPU pair. Both arms consume the same 322
# update draws: 322 * 2 * 8 * 2,048 = 10,551,296 scheduled tokens. This is an early held-out-loss
# comparison, not the locally prespecified multi-seed 5-tokens/parameter architecture screen.
stage: pretrain
model_config: configs/model/webgpu-10m-hybrid.yaml
data:
  shards_dir: data/shards/webgpu-proxy-120m
  min_train_tokens: 10551296
  tokenizer:
    kind: bpe
    path: data/tokenizer-webgpu-proxy-16k.json
optim:
  name: adamw
  lr: 3.0e-4
  weight_decay: 0.1
  grad_clip: 1.0
schedule:
  type: wsd
  warmup_steps: 6
  total_steps: 322
  decay_frac: 0.2
batch:
  micro_batch_size: 2
  grad_accum_steps: 8
runtime:
  device: auto
  dtype: auto
  seed: 2026
  resume: true
log:
  out_dir: runs/pretrain-webgpu-proxy-1tpp-hybrid-seed2026
  ckpt_every: 50
  eval_every: 25
  eval_batches: 16

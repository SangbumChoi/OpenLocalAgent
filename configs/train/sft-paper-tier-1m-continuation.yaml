# Fresh-optimizer recovery child for the completed 348-step 1M SFT horizon.
#
# The parent consumed canonical quota decisions [0, 5,568). This independently planned child
# consumes the unseen [5,568, 93,504) tail exactly once. It must not replace the RL parent until
# held-out generative format/action gates pass.
stage: sft
model_config: configs/model/webgpu-1m-bpe-router.yaml
init_from: runs/sft-paper-tier-1m/latest.pt
continuation:
  mode: fresh_optimizer_sft_child_v1
data:
  conversation_prompt_contract: openai_full_catalog_v1
  strict_conversation_artifacts: true
  conversations:
    - path: data/synth/agent_sft_paper_train_v2.jsonl
      artifact:
        generator_config: configs/data/agent_synth_paper_train_v2.yaml
        manifest: data/synth/agent_sft_paper_train_v2.jsonl.manifest.v1.json
        expected_split: train
        expected_rule_verified: true
        environment_policy: forbid
  eval_conversations:
    - path: data/synth/agent_eval.jsonl
      artifact:
        generator_config: configs/data/agent_synth_eval.yaml
        manifest: data/synth/agent_eval.jsonl.manifest.v1.json
        expected_split: eval
        expected_rule_verified: true
        environment_policy: forbid
  tokenizer:
    kind: bpe
    path: data/tokenizer-paper-16k.json
  seq_len: 4096
  function_masking: false
  shuffle: false
  sampling:
    mode: quota_stratified_no_replacement_v1
    start_decision: 5568
optim:
  name: adamw
  # A conservative fresh-optimizer peak after the parent's WSD endpoint.
  lr: 2.5e-5
  weight_decay: 0.0
  grad_clip: 1.0
schedule:
  type: wsd
  warmup_steps: 110
  total_steps: 5496
  decay_frac: 0.2
batch:
  micro_batch_size: 2
  grad_accum_steps: 8
evaluation:
  batch_size: 8
  max_conversations: 512
  selection: greedy_uncovered_strata_then_semantic_sha256_fill_v1
heads:
  joint_tool_pointer: false
  train_route_head: false
  train_dense_selector: false
runtime:
  device: auto
  dtype: auto
  seed: 2026
log:
  out_dir: runs/sft-paper-tier-1m-continuation
  ckpt_every: 100

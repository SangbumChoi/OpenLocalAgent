# Conservative mixed-replay recovery pilot for the completed 1M paper SFT checkpoint.
#
# The rejected format-only child over-weighted a final short-text block and catastrophically
# forgot held-out agent behavior. This fresh child returns to the original sealed SFT parent.
# Every optimizer update consumes exactly 12 quota-selected broad decisions plus one unchanged
# row from each strict-format phase. General rows whose Conversation semantic identity appears in
# the format artifact are excluded from the selected prefix.
stage: sft
model_config: configs/model/webgpu-1m-bpe-router.yaml
init_from: runs/sft-paper-tier-1m/latest.pt
continuation:
  mode: fresh_optimizer_sft_child_v1
data:
  conversation_prompt_contract: openai_full_catalog_v1
  strict_conversation_artifacts: true
  conversations:
    - path: data/synth/agent_sft_paper_train_v2.jsonl
      artifact:
        generator_config: configs/data/agent_synth_paper_train_v2.yaml
        manifest: data/synth/agent_sft_paper_train_v2.jsonl.manifest.v1.json
        expected_split: train
        expected_rule_verified: true
        environment_policy: forbid
    - path: data/synth/agent_sft_format_bootstrap_v1.jsonl
      artifact:
        generator_config: configs/data/agent_sft_format_bootstrap_v1.yaml
        manifest: data/synth/agent_sft_format_bootstrap_v1.jsonl.manifest.v1.json
        expected_split: train
        expected_rule_verified: true
        environment_policy: forbid
  eval_conversations:
    - path: data/synth/agent_eval.jsonl
      artifact:
        generator_config: configs/data/agent_synth_eval.yaml
        manifest: data/synth/agent_eval.jsonl.manifest.v1.json
        expected_split: eval
        expected_rule_verified: true
        environment_policy: forbid
  tokenizer:
    kind: bpe
    path: data/tokenizer-paper-16k.json
  seq_len: 4096
  function_masking: false
  shuffle: false
  sampling:
    mode: general_format_mixed_no_replacement_v2
    general_source_index: 0
    format_source_index: 1
    exclude_format_semantic_overlap: true
    # With micro-batch 2 and accumulation 8 this is exactly one complete optimizer update.
    # Each short format row is paired with a general row before update-level token normalization.
    cycle:
      - general
      - general
      - general
      - format_core
      - general
      - general
      - general
      - multi_argument
      - general
      - general
      - general
      - parallel
      - general
      - general
      - general
      - text
optim:
  name: adamw
  lr: 5.0e-6
  weight_decay: 0.0
  grad_clip: 1.0
  # Accumulated gradients are exactly assistant-token weighted across all 16 rows.
  loss_normalization: assistant_token_mean_per_update_v1
schedule:
  type: cosine
  warmup_steps: 16
  total_steps: 256
batch:
  micro_batch_size: 2
  grad_accum_steps: 8
  # Full general-train post-shift maximum; fixed width contains MPSGraph cache growth.
  pad_to_input_tokens: 3684
evaluation:
  batch_size: 8
  max_conversations: 512
  selection: greedy_uncovered_strata_then_semantic_sha256_fill_v1
  pad_to_input_tokens: 3598
heads:
  joint_tool_pointer: false
  train_route_head: false
  train_dense_selector: false
runtime:
  device: auto
  dtype: auto
  seed: 2026
log:
  out_dir: runs/sft-paper-tier-1m-mixed-replay-pilot
  ckpt_every: 32
  archive_checkpoints: true

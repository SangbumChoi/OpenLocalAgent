# Parameter-matched all-attention SFT control for the 4K near-budget 95.3M tier.
# Execution remains gated on a measured one-update memory/throughput preflight.
stage: sft
model_config: configs/model/webgpu-96m-attn.yaml
init_from: runs/midtrain-paper-tier-96m-attn/latest.pt
data:
  conversation_prompt_contract: openai_full_catalog_v1
  strict_conversation_artifacts: true
  conversations:
    - path: data/synth/agent_sft_paper_train_v2.jsonl
      artifact:
        generator_config: configs/data/agent_synth_paper_train_v2.yaml
        manifest: data/synth/agent_sft_paper_train_v2.jsonl.manifest.v1.json
        expected_split: train
        expected_rule_verified: true
        environment_policy: forbid
  eval_conversations:
    - path: data/synth/agent_eval.jsonl
      artifact:
        generator_config: configs/data/agent_synth_eval.yaml
        manifest: data/synth/agent_eval.jsonl.manifest.v1.json
        expected_split: eval
        expected_rule_verified: true
        environment_policy: forbid
  tokenizer:
    kind: bpe
    path: data/tokenizer-paper-16k.json
  seq_len: 4096
  function_masking: false
  shuffle: false
  sampling:
    mode: quota_stratified_no_replacement_v1
optim:
  name: adamw
  lr: 5.0e-5
  weight_decay: 0.0
  grad_clip: 1.0
schedule:
  type: wsd
  warmup_steps: 34
  total_steps: 1690
  decay_frac: 0.2
batch:
  micro_batch_size: 1
  grad_accum_steps: 16
evaluation:
  batch_size: 1
  max_conversations: 512
  selection: greedy_uncovered_strata_then_semantic_sha256_fill_v1
heads:
  # The primary paper lane is full-catalog autoregressive generation. Bespoke structured heads
  # remain a separate post-RL deployment experiment and are not mixed into BFCL-style scores.
  joint_tool_pointer: false
  train_route_head: false
  train_dense_selector: false
runtime:
  device: auto
  dtype: auto
  seed: 2026
log:
  out_dir: runs/sft-paper-tier-96m-attn
  ckpt_every: 100

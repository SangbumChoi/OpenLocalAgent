# Phase 4 — supervised fine-tune on agent conversations.
# Loss is masked to assistant + tool-call spans; function masking on (Hammer).
stage: sft
model_config: configs/model/tiny-30m-byte.yaml
init_from: runs/midtrain/latest.pt
data:
  strict_conversation_artifacts: true
  conversations:
    - path: data/synth/agent_sft.jsonl
      artifact:
        generator_config: configs/data/agent_synth.yaml
        manifest: data/synth/agent_sft.jsonl.manifest.v1.json
        expected_split: train
        expected_rule_verified: true
        environment_policy: forbid
  tokenizer:
    kind: byte
  seq_len: 2048
  mask_user_and_tool_response: true   # only learn assistant/tool_call tokens
  # Opt-in schema-preserving tool-name masking is available for LM-only SFT; keep the baseline
  # lane canonical so its historical scorecards remain byte-stable.
  function_masking: false
  shuffle: true
heads:
  joint_tool_pointer: true
  train_route_head: true
  train_dense_selector: true
  tool_loss_weight: 1.0
  pointer_loss_weight: 0.15
  selector_proj: 256
  route_steps: 300
  selector_steps: 400
  probe_batch_size: 64
  probe_lr: 5.0e-3
optim:
  name: adamw
  lr: 1.0e-4
  weight_decay: 0.0
  grad_clip: 1.0
schedule:
  warmup_steps: 50
  total_steps: 3000
  min_lr_ratio: 0.1
batch:
  micro_batch_size: 8
  grad_accum_steps: 2
runtime:
  device: auto
  dtype: auto
log:
  out_dir: runs/sft

# Parameter-matched all-attention control for the seed-2028 5-tpp replicate.
stage: pretrain
model_config: configs/model/webgpu-35m-attn.yaml
data:
  shards_dir: data/shards/paper-all
  min_train_tokens: 171409408
  corpus_freeze:
    spec: configs/data/pretrain-paper-freeze.yaml
    path: data/shards/paper-all/freeze.json
  tokenizer:
    kind: bpe
    path: data/tokenizer-paper-16k.json
optim:
  name: adamw
  lr: 3.0e-4
  weight_decay: 0.1
  grad_clip: 1.0
schedule:
  type: wsd
  warmup_steps: 100
  total_steps: 5231
  decay_frac: 0.2
batch:
  micro_batch_size: 2
  grad_accum_steps: 8
runtime:
  device: auto
  dtype: auto
  seed: 2028
  resume: true
log:
  out_dir: runs/pretrain-paper-5tpp-attn-seed2028
  ckpt_every: 250
  eval_every: 250
  eval_batches: 16

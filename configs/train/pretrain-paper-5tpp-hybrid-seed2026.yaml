# First locally prespecified matched-quality pilot. Both arms consume the same 5,231 update draws:
# 5,231 * 2 * 8 * 2,048 = 171,409,408 scheduled tokens. Realized loss-token accounting remains
# authoritative because a sampled final packed row can contain padding.
stage: pretrain
model_config: configs/model/webgpu-35m-hybrid.yaml
data:
  shards_dir: data/shards/paper-all
  min_train_tokens: 171409408
  corpus_freeze:
    spec: configs/data/pretrain-paper-freeze.yaml
    path: data/shards/paper-all/freeze.json
  tokenizer:
    kind: bpe
    path: data/tokenizer-paper-16k.json
optim:
  name: adamw
  lr: 3.0e-4
  weight_decay: 0.1
  grad_clip: 1.0
schedule:
  type: wsd
  warmup_steps: 100
  total_steps: 5231
  decay_frac: 0.2
batch:
  micro_batch_size: 2
  grad_accum_steps: 8
runtime:
  device: auto
  dtype: auto
  seed: 2026
  resume: true
log:
  out_dir: runs/pretrain-paper-5tpp-hybrid-seed2026
  ckpt_every: 250
  eval_every: 250
  eval_batches: 16
